[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-optimizer"
version = "0.1.0"
description = "MILP and Multi-Dimensional Knapsack solver for scheduling containerized compute tasks onto heterogeneous VM instances."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "saifabdesmad", email = "saracouca03@gmail.com" }
]
keywords = ["operations-research", "milp", "knapsack", "cloud-scheduling", "pulp", "devops"]
dependencies = [
    "pulp>=2.7.0,<4.0.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
cloud-optimizer = "cloud_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
filterwarnings = ["ignore::DeprecationWarning:pulp.*"]
